[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Métadonnées du package (PEP 621)
# ---------------------------------------------------------------------------
[project]
name = "abb-rws6-python-client"
version = "0.1.0"
description = "Async Python client for ABB Robot Web Services (RobotWare 6)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Clément RACINET", email = "clement.racinet@ensam.eu" }
]
keywords = ["ABB", "RWS", "robotics", "RAPID", "RobotWare"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
]

[project.urls]
Repository = "https://gitlab.ensam.eu/lcfc/abb-rws-client-python-rw6"
Issues     = "https://gitlab.ensam.eu/lcfc/abb-rws-client-python-rw6/issues"


[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "anyio[trio]>=4.0",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.4,<1.0",
]

# ---------------------------------------------------------------------------
# Hatchling — découverte du package
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["abb_rws_client"]

# ---------------------------------------------------------------------------
# Ruff — linting & formatting
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "ANN", # annotations (type hints)
]
ignore = [  

]

[tool.ruff.lint.per-file-ignores]
"abb_rws_client/_core/client.py" = ["ANN401"]  # **kwargs: Any forwarded to httpx

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["abb_rws_client"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function" 
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
log_cli = true
log_cli_level = "INFO"
addopts = [
    "--cov=abb_rws_client",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=html:docs/coverage",
    "--cov-report=xml:coverage.xml",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source  = ["abb_rws_client"]
branch = true
omit = [
    ".pixi/*",
    "tests/*",
    "contrib/*",
    "site/*",
    "docs/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "docs/coverage"
# ---------------------------------------------------------------------------
# basedpyright — type checker VS Code
# ---------------------------------------------------------------------------
[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"

# Règles désactivées intentionnellement :
# - reportImplicitOverride   : typing.override n'existe qu'en Python 3.12+
# - reportUnknownMemberType  : faux positifs sur les stubs tiers incomplets (pytest.approx)
# - reportUnusedCallResult   : pattern légitime dans pytest.raises (assignation à _)
reportImplicitOverride = "none"
reportUnknownMemberType = "none"
reportUnusedCallResult  = "none"