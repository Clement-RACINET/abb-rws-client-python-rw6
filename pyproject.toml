[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "abb_rws_client_python_rw6"
version = "0.8.0"
description = "Async Python client for ABB Robot Web Services (RobotWare 6)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Clement RACINET", email = "clement.racinet@ensam.eu" }
]
keywords = ["ABB", "RWS", "robotics", "RAPID", "RobotWare"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]

# ← Strictement runtime : ce que pip installe pour l'utilisateur final
dependencies = [
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
]

[project.urls]
Repository = "https://gitlab.ensam.eu/lcfc/abb_rws_client_python_rw6"
Issues     = "https://gitlab.ensam.eu/lcfc/abb_rws_client_python_rw6/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "anyio>=4.0",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.4,<1.0",
]
scraping = [
    "requests>=2.32,<3.0",
    "beautifulsoup4>=4.12,<5.0",
]

# ── Hatchling ──────────────────────────────────────────────────────────────
[tool.hatch.build.targets.wheel]
packages = ["abb_rws_client_python_rw6"]

# ── Ruff ───────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "ANN"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"abb_rws_client/core/client.py" = ["ANN401"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["abb_rws_client_python_rw6"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── Pytest ─────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
log_cli = true
log_cli_level = "INFO"
addopts = [
    "--cov=abb_rws_client_python_rw6",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=html:docs/coverage",
    "--cov-report=xml:tests/coverage.xml",
]

# ── Coverage ───────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["abb_rws_client_python_rw6"]
branch = true
omit = [".pixi/*", "tests/*", "utils/*", "site/*", "docs/*", "*old*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "docs/coverage"

# ── basedpyright ───────────────────────────────────────────────────────────
[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportImplicitOverride = "none"
reportUnknownMemberType = "none"
reportUnusedCallResult  = "none"
