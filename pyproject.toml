[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "abb_rws_client_python_rw6"
version = "1.0.0"
description = "Async Python client for ABB Robot Web Services (RobotWare 6)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "RACINET Clément", email = "clement.racinet@ensam.eu" }
]
keywords = ["ABB", "RWS", "robotics", "RAPID", "RobotWare"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]

# ← Strictement runtime : ce que pip installe pour l'utilisateur final
dependencies = [
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
    "websockets>=13.0",
]

[project.urls]
Repository = "https://github.com/Clement-RACINET/abb-rws-client-python-rw6"
Issues     = "https://github.com/Clement-RACINET/abb-rws-client-python-rw6/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "anyio>=4.0",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.4,<1.0",
]
scraping = [
    "requests>=2.32,<3.0",
    "beautifulsoup4>=4.12,<5.0",
]

# ── Hatchling ──────────────────────────────────────────────────────────────
[tool.hatch.build.targets.wheel]
packages = ["abb_rws_client_python_rw6"]
artifacts = ["abb_rws_client_python_rw6/py.typed"]

# ── Ruff ───────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "ANN"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"abb_rws_client/core/client.py" = ["ANN401"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["abb_rws_client_python_rw6"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── Pytest ─────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
log_cli = true
log_cli_level = "INFO"
addopts = [
    "--cov=abb_rws_client_python_rw6",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=html:docs/coverage",
    "--cov-report=xml:tests/coverage.xml",
]

# ── Coverage ───────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["abb_rws_client_python_rw6"]
branch = true
omit = [".pixi/*", "tests/*", "utils/*", "site/*", "docs/*", "*old*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "docs/coverage"

# ── basedpyright ───────────────────────────────────────────────────────────
[tool.basedpyright]
typeCheckingMode = "standard"
reportImplicitOverride = "none"
reportUnknownMemberType = "none"
reportUnusedCallResult  = "none"


# ── py-init-tools ──────────────────────────────────────────────────────────
[tool.py-init-tools]
package_roots = ["abb_rws_client_python_rw6"]
test_roots = ["tests"]

package_version = "1.0.0"
package_description = "Async Python client for ABB Robot Web Services (RobotWare 6)."
generated_marker = "Generated by py-init-tools"

generate_root_reexports = true
discovery_mode = "all_public"
export_constants = true
export_type_aliases = true

reexport_allowlist = [
    "core",
    "highlevel",
    "rws",
    "rws/ctrl",
    "rws/iosystem",
    "rws/rapid",
    "rws/rw",
    "rws/users",
]

flat_subdirs = []


[tool.py-structure-tools]
exclude_dirs = [
    "docs",
    "site",
    "build",
    "dist",
]

exclude_files = [
    "*.log",
    "*.tmp",
    "*.bak",
]

include_hidden = false
use_gitignore = true
max_depth = 5
default_formats = ["txt", "html"]
output_basename = "rws_structure"

# ── py-doc-tools ───────────────────────────────────────────────────────────
[tool.py-doc-tools]
docs_dir = "docs"
docs_src_dir = "docs"
mkdocs_config = "mkdocs.yml"
packages = ["abb_rws_client_python_rw6"]

enable_api = true
enable_coverage = true
enable_readme = true

enable_examples = false
enable_todo = false
enable_diagrams = false
enable_diagnostics = false
enable_tags = false

[tool.py-doc-tools.api]
output_dir = "docs/api"
clean_output_dir = true

[tool.py-doc-tools.coverage]
package = "abb_rws_client_python_rw6"
title = "Test coverage report"

[tool.py-doc-tools.readme]
source_file = "README.md"
output_file = "docs/index.md"
title = "ABB RWS Client Python RW6"
