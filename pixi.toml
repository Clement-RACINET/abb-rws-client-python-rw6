[project]
name = "abb-rws6-python-client"
version = "0.1.0"
description = "Python client for ABB Robot Web Services (RobotWare 6)"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-arm64"]

[environments]
default = { features = ["dev"], solve-group = "default" }

[dependencies]
python = "3.11.*"
httpx = ">=0.28.1,<0.29"
pathspec = ">=1.1.1,<2"

[pypi-dependencies]
httpx = ">=0.27,<1.0"
python-dotenv = ">=1.0,<2.0"

# Package lui-même en mode éditable
abb-rws6-python-client = { path = ".", editable = true }
pytest-cov = ">=7.1.0, <8"

[feature.dev.pypi-dependencies]
pytest = ">=8.0,<9.0"
pytest-asyncio = ">=0.23,<1.0"
anyio = { version = ">=4.0", extras = ["trio"] }   # backend async pour pytest-asyncio
ruff = ">=0.4,<1.0"

[feature.dev.tasks]
lint   = "ruff check abb_rws_client tests"
format = "ruff format abb_rws_client tests"
test   = "pytest tests/ -v --cov=abb_rws_client --cov-report=term-missing"
