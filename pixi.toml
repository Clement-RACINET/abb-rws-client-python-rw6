[project]
name = "abb-rws6-python-client"
version = "0.1.0"
description = "Python client for ABB Robot Web Services (RobotWare 6)"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-arm64"]

[environments]
default  = { features = ["dev"],      solve-group = "default" }
scraping = { features = ["scraping"], solve-group = "default" }

# ── Dépendances communes ──────────────────────────────────────────────────
[dependencies]
python   = "3.11.*"
httpx    = ">=0.28.1,<0.29"
pathspec = ">=1.1.1,<2"

[pypi-dependencies]
abb-rws6-python-client = { path = ".", editable = true }  # Package en mode éditable
httpx         = ">=0.27,<1.0"
python-dotenv = ">=1.0,<2.0"
pytest-cov    = ">=7.1.0,<8"

# ── Feature : dev ─────────────────────────────────────────────────────────
[feature.dev.pypi-dependencies]
pytest         = ">=8.0,<9.0"
pytest-asyncio = ">=0.23,<1.0"
anyio          = { version = ">=4.0", extras = ["trio"] }
ruff           = ">=0.4,<1.0"

[feature.dev.tasks]  # ← une seule fois !
lint   = "ruff check abb_rws_client tests"
format = "ruff format abb_rws_client tests"
test   = "pytest tests/ -v --cov=abb_rws_client --cov-report=term-missing"

# ── Feature : scraping ────────────────────────────────────────────────────
[feature.scraping.pypi-dependencies]
requests       = ">=2.32,<3.0"
beautifulsoup4 = ">=4.12,<5.0"

[feature.scraping.tasks]
scrape = "python _scrapping_abb_api/scrape.py"