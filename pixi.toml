[project]
name = "abb_rws_client_python_rw6"
version = "1.0.0"
description = "Python client for ABB Robot Web Services (RobotWare 6)"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-arm64"]

[environments]
default  = { features = [],                              solve-group = "default" }
dev      = { features = ["dev"],                         solve-group = "default" }
examples = { features = ["examples"],                    solve-group = "default" }
full     = { features = ["dev", "scraping", "examples"], solve-group = "default" }

# ── Dépendances runtime (utilisateur final) ───────────────────────────────
[dependencies]
python = "3.11.*"

[pypi-dependencies]
abb_rws_client_python_rw6 = { path = ".", editable = true }
httpx                     = ">=0.27,<1.0"
python-dotenv             = ">=1.0,<2.0"
websockets = ">=13.0"

# ── Feature : dev ─────────────────────────────────────────────────────────
[feature.dev.pypi-dependencies]
pytest          = ">=8.0,<9.0"
pytest-asyncio  = ">=0.24,<1.0"
anyio           = ">=4.0"
pytest-cov      = ">=7.1.0,<8"
ruff            = ">=0.4,<1.0"
mkdocs          = ">=1.6,<2.0"
mkdocs-material = ">=9.5,<10.0"
mkdocstrings    = { version = ">=0.25,<1.0", extras = ["python"] }
mkdocs-coverage = ">=2.0.0,<3"

[feature.dev.tasks]
lint        = "ruff check abb_rws_client_python_rw6 tests"
format      = "ruff format abb_rws_client_python_rw6 tests"
tests       = "python -m pytest tests/ -v"
fix_init    = "python utils/fix_init.py"
clean_cache = "python utils/clean_cache.py"
docs        = "python utils/docs/run_docs.py"
docs-build  = "python -m mkdocs build"

# ── Feature : scraping ────────────────────────────────────────────────────
[feature.scraping.pypi-dependencies]
requests       = ">=2.32,<3.0"
beautifulsoup4 = ">=4.12,<5.0"

[feature.scraping.tasks]
scrape = "python utils/scraping/scrape.py"

# ── Feature : examples ────────────────────────────────────────────────────
[feature.examples.pypi-dependencies]


[feature.examples.tasks]
example-06 = "python exemples/06/subscription.py"
example-07 = "python exemples/07/write_robtarget_array.py"




[tool.pytest.ini_options]
asyncio_mode                       = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--cov=trajcenter",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=html:docs/coverage",
    "--cov-report=xml:coverage.xml",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["abb_rws_client_python_rw6", "tests"]
branch = true
omit   = [".pixi/*", "*/site-packages/*", "examples/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.coverage.html]
directory = "docs/coverage"
title     = "TrajCenter — Coverage Report"

[tool.coverage.xml]
output = "coverage.xml"